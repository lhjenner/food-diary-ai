<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <title>Food Diary</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="sign-in-panel" id="signed-out-view" aria-labelledby="sign-in-title">
      <p class="eyebrow">Daily food diary</p>
      <h1 id="sign-in-title">A clearer record of your day.</h1>
      <p class="intro">Sign in to keep your meals and weight entries private and available on every device.</p>
      <button class="button button-primary" id="sign-in-button" type="button">Continue with Google</button>
    </section>

    <section class="app-panel" id="signed-in-view" hidden aria-labelledby="app-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">Food diary</p>
          <h1 id="app-title">Welcome back</h1>
          <p class="signed-in-as" id="signed-in-as"></p>
        </div>
        <button class="button button-secondary" id="sign-out-button" type="button">Sign out</button>
      </header>
      <p class="coming-soon">Your diary is ready. Daily entries arrive in the next phase.</p>
    </section>

    <p class="status-message" id="status-message" role="status" aria-live="polite" hidden></p>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
